name: Build cache

# Publishes the compiler cache of a build as the snapshot that later builds start from: the file
# ccache-clang18.tar of the build-cache release. It runs after a "Build" run that was started by
# hand on main with "snapshot" ticked (that run leaves the cache as its ccache-snapshot artifact).
# The build workflow itself never writes to a release that already has files.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-compiler-cache
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish the compiler cache snapshot
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Replace the snapshot in the build-cache release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=ccache-snapshot" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          if [ -z "$artifact" ]; then
            echo "That run kept no compiler cache snapshot."
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ccache-snapshot --dir snapshot
          file=snapshot/ccache-clang18.tar
          test -s "$file"

          if release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/build-cache" 2>&1); then
            gh release upload build-cache "$file" --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ $release == *"HTTP 404"* ]]; then
            gh release create build-cache "$file" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --title "Compiler cache snapshot" \
              --notes "Compiler cache for the default branch build workflow."
          else
            printf '%s\n' "$release" >&2
            exit 1
          fi
