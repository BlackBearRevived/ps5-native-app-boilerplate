name: Build

on:
  push:
    branches: [main]
    tags:
      - "[0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.label.outputs.artifact }}
      title-id: ${{ steps.identity.outputs.title-id }}
      release-tag: ${{ steps.identity.outputs.release-tag }}
      source-sha: ${{ steps.identity.outputs.source-sha }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M
      CACHE_PREFIX: build-v2-ubuntu24-clang18-python313

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 make ninja-build ccache pkg-config tar unzip wget

      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('tools/setup-*-dependencies.sh') }}

      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-ccache-${{ hashFiles('Makefile', 'src/**', 'runtime/**', 'tooling/**', 'tools/**', 'tests/**', 'examples/**') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ runner.arch }}-ccache-

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        id: identity
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          release_tag=${content_version#0}
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            if [[ $GITHUB_REF_NAME != "$release_tag" && $GITHUB_REF_NAME != "$content_version" ]]; then
              echo "Release tag must agree with param.json contentVersion: $content_version" >&2
              exit 2
            fi
            release_tag=$GITHUB_REF_NAME
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "title-id=$title_id" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app (docs/PULL_REQUEST_BUILDS.md); the version in
      # param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=ps5-native-app-boilerplate-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Check update-check parsing and decisions
        run: make test-update-check

      - name: Build update-check example
        run: |
          make update-check-example
          test -f dist/PPSA99780/assets/targets.txt

      - name: Check self-update engine and helper
        run: make test-self-update

      - name: Build self-update example
        run: |
          make self-update-example
          test -f dist/PPSA99782/self-updater.elf

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The in-app update worker and ProsperoStore install from the folder ZIP.
      - name: Build the release folder and ZIP
        run: make app

      - name: Build and verify the PS5 package
        shell: bash
        run: |
          source_dir="dist/$TITLE_ID"
          supported=$(python3 -c '
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              app = json.load(stream)
          print(app.get("applicationCategoryType") == 0 and app.get("applicationDrmType") == "free")
          ' "$source_dir/sce_sys/param.json")
          if [[ $supported != True ]]; then
            echo "::notice::ps5-pkgkit v0.1.0 supports free Games-area apps only. Skipping the PKG."
            exit 0
          fi

          python -m pip install --no-index --no-deps --require-hashes \
            'https://github.com/BlackBearRevived/ps5-pkgkit/releases/download/v0.1.0/ps5_pkgkit-0.1.0-py3-none-any.whl#sha256=71cfa598c509322c6752c094486935a8334d7cf0fceb73e838810e46a3823541'
          ps5-pkgkit build "$source_dir" -o "$source_dir.pkg"
          ps5-pkgkit verify "$source_dir.pkg"
          (cd dist && sha256sum "$TITLE_ID.pkg" > "$TITLE_ID.pkg.sha256")

      - name: Report compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            echo '### Compiler cache' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" > SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
            dist/${{ env.TITLE_ID }}.pkg
            dist/${{ env.TITLE_ID }}.pkg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # PRs may restore the default branch's caches. Only successful builds on
      # that branch save shared caches. Exact keys are immutable.
      - name: Save dependencies
        if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' && github.event_name != 'pull_request' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' && github.event_name != 'pull_request' && steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}

  attest:
    name: Attest PS5 build artifacts
    needs: build
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download and check this run's build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          TITLE_ID: ${{ needs.build.outputs.title-id }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir package
          cd package
          sha256sum -c --strict SHA256SUMS
          if [[ -e "$TITLE_ID.pkg" || -e "$TITLE_ID.pkg.sha256" ]]; then
            sha256sum -c --strict "$TITLE_ID.pkg.sha256"
          fi

      - name: Sign GitHub Actions build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            package/${{ needs.build.outputs.title-id }}.zip
            package/${{ needs.build.outputs.title-id }}.pkg

  release:
    name: Publish PS5 release
    needs: [build, attest]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.attest.result == 'success' || (github.event.repository.private && needs.attest.result == 'skipped')) &&
      (github.ref_type == 'tag' ||
        (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ needs.build.outputs.release-tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.release-tag }}
      SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
      ARTIFACT: ${{ needs.build.outputs.artifact }}
      TITLE_ID: ${{ needs.build.outputs.title-id }}

    steps:
      - name: Check whether this version needs publishing
        id: plan
        run: |
          set -euo pipefail
          # Include a prepared draft if present. A lookup failure stops publication.
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\")")
          if [[ -n $release ]] && jq -e 'any(.assets[]; .name | endswith(".zip"))' <<< "$release" >/dev/null; then
            echo "$TAG already has a release ZIP."
            exit 0
          fi

          if tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1); then
            target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [[ $target != "$SOURCE_SHA" ]]; then
              echo "::notice::Tag $TAG already points to $target. Version unchanged."
              exit 0
            fi
          elif [[ $tag == *"HTTP 404"* && $GITHUB_REF_TYPE == branch ]]; then
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$tag" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [[ -n $release ]]; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and check the release files
        if: steps.plan.outputs.publish == 'true'
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir package
          cd package
          test -s "$TITLE_ID.zip"
          sha256sum -c --strict SHA256SUMS
          if [[ -e "$TITLE_ID.pkg" || -e "$TITLE_ID.pkg.sha256" ]]; then
            sha256sum -c --strict "$TITLE_ID.pkg.sha256"
          fi

      - name: Create the version tag
        if: steps.plan.outputs.create_tag == 'true'
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" --jq .ref

      - name: Publish the release files
        if: steps.plan.outputs.publish == 'true'
        env:
          EXISTING: ${{ steps.plan.outputs.existing }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          assets=("package/$TITLE_ID.zip" package/SHA256SUMS)
          if [[ -f "package/$TITLE_ID.pkg" ]]; then
            assets+=("package/$TITLE_ID.pkg" "package/$TITLE_ID.pkg.sha256")
          fi
          if [[ $EXISTING == true ]]; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "PS5 Native App Boilerplate $TAG"
          fi
